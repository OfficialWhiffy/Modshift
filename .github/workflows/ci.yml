name: CI - Build and Test

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "**/.gitignore", "**/.gitattributes"]
  pull_request:
    branches: [master]
    paths-ignore: ["**/*.md", "**/.gitignore", "**/.gitattributes"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TruckModsListUpdater.slnx --configuration Release

      - name: Test
        run: dotnet test TruckModsListUpdater.slnx --configuration Release --no-build --filter "Category!=LocalMachine" --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/
          retention-days: 30
