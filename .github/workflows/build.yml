name: Release

# Every merge to master publishes a release, versioned by Semantic Versioning 2.0.0 (https://semver.org).
# The next version is the latest vMAJOR.MINOR.PATCH tag plus a patch bump, or a minor/major bump when the
# merged PR carries a "minor" or "major" label (see CONTRIBUTING.md "Releasing" for what counts as which).
# The first release is v1.0.0. To publish a specific version or a pre-release instead, push a tag:
# git tag v1.1.0-rc.1 && git push origin v1.1.0-rc.1
# A version must be higher than every existing tag, and a published release is never replaced.
# Either way the version is handed to MinVer, which stamps it into the executable.
on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "**/.gitignore", "**/.gitattributes"]
    tags: ["v*"]

# Two merges in quick succession must not pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - name: Determine version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Official semver.org pattern for MAJOR.MINOR.PATCH[-prerelease]; tags carry no build metadata.
          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'

          # Precedence as defined in https://semver.org/#spec-item-11. Returns -1, 0 or 1.
          function Compare-SemVer([string]$a, [string]$b) {
            $ma = [regex]::Match($a, $semver)
            $mb = [regex]::Match($b, $semver)
            foreach ($i in 1..3) {
              $c = [bigint]::Compare([bigint]$ma.Groups[$i].Value, [bigint]$mb.Groups[$i].Value)
              if ($c -ne 0) { return $c }
            }
            $pa = $ma.Groups[4].Value
            $pb = $mb.Groups[4].Value
            if ($pa -ceq $pb) { return 0 }
            if ($pa -eq '') { return 1 }  # a release outranks its pre-releases
            if ($pb -eq '') { return -1 }
            $ia = $pa.Split('.')
            $ib = $pb.Split('.')
            for ($i = 0; $i -lt [math]::Min($ia.Length, $ib.Length); $i++) {
              $na = [regex]::IsMatch($ia[$i], '^\d+$')
              $nb = [regex]::IsMatch($ib[$i], '^\d+$')
              if ($na -and $nb) { $c = [bigint]::Compare([bigint]$ia[$i], [bigint]$ib[$i]) }
              elseif ($na) { $c = -1 }  # numeric identifiers rank below alphanumeric ones
              elseif ($nb) { $c = 1 }
              else { $c = [math]::Sign([string]::CompareOrdinal($ia[$i], $ib[$i])) }
              if ($c -ne 0) { return $c }
            }
            return [math]::Sign($ia.Length - $ib.Length)  # more identifiers outrank fewer
          }

          # Every valid semver tag; the old untidy tags (V2.0.0, v.1.4) are ignored.
          $existing = @(git tag --list 'v*' |
            Where-Object { $_ -cmatch '^v' -and [regex]::IsMatch($_.Substring(1), $semver) } |
            ForEach-Object { $_.Substring(1) })

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -cnotmatch '^v' -or -not [regex]::IsMatch($tag.Substring(1), $semver)) {
              throw "Tag '$tag' is not a valid Semantic Version (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, see https://semver.org)"
            }
            $version = $tag.Substring(1)
          } else {
            # Pre-releases are not release baselines, so only plain releases are bumped.
            $latest = $existing |
              Where-Object { $_ -notmatch '-' } |
              Sort-Object { [version]$_ } -Descending |
              Select-Object -First 1

            if ($null -eq $latest) {
              $version = '1.0.0' # No release tag yet: the first release.
            } else {
              $labels = gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name'
              $core = [version]$latest
              if ($labels -contains 'major')     { $next = [version]"$($core.Major + 1).0.0" }
              elseif ($labels -contains 'minor') { $next = [version]"$($core.Major).$($core.Minor + 1).0" }
              else                               { $next = [version]"$($core.Major).$($core.Minor).$($core.Build + 1)" }
              $version = $next.ToString(3)
            }

            # Matches MinVerMinimumMajorMinor in Directory.Build.props.
            if ([version]$version -lt [version]'1.0.0') { $version = '1.0.0' }
          }

          # Versions only increase, and a published release is never replaced.
          foreach ($other in ($existing | Where-Object { $_ -cne $version })) {
            if ((Compare-SemVer $version $other) -le 0) {
              throw "v$version does not outrank the existing tag v$other. Push a higher tag by hand."
            }
          }
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$version already exists. A published version is never replaced; delete it deliberately or push a new version."
          }
          Write-Host "Releasing v$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test TruckModsListUpdater.slnx --configuration Release --filter "Category!=LocalMachine"

      - name: Publish single executable
        run: dotnet publish src/TruckModsListUpdater.App/TruckModsListUpdater.App.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:MinVerVersionOverride=${{ env.VERSION }}

      - name: Verify executable version matches the release
        shell: pwsh
        run: |
          $actual = (Get-Item ./publish/Modshift.exe).VersionInfo.ProductVersion
          if (-not $actual.StartsWith($env:VERSION)) {
            throw "Executable reports '$actual' but the release is 'v$($env:VERSION)'"
          }

      - name: Create ZIP archive
        run: Compress-Archive -Path ./publish/Modshift.exe -DestinationPath ./Modshift-${{ env.VERSION }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: ./Modshift-${{ env.VERSION }}-win-x64.zip
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
